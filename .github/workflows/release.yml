name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

  build:
    name: Build Native Executables
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: agy_patcher-windows-x64.exe
            build_cmd: pyinstaller --clean --onefile --name agy_patcher-windows-x64 agy_patcher.py
            output_dir: dist/agy_patcher-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: agy_patcher-linux-x64
            build_cmd: pyinstaller --clean --onefile --name agy_patcher-linux-x64 agy_patcher.py
            output_dir: dist/agy_patcher-linux-x64
          - os: macos-latest
            artifact_name: agy_patcher-macos-universal
            build_cmd: |
              pyinstaller --clean --onefile --target-arch universal2 --name agy_patcher-macos-universal agy_patcher.py || \
              pyinstaller --clean --onefile --name agy_patcher-macos-universal agy_patcher.py
            output_dir: dist/agy_patcher-macos-universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build standalone executable
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_dir }}

  build-zipapp:
    name: Build Universal Zipapp
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Zipapp
        run: python build.py --zipapp-only

      - name: Upload Zipapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy_patcher.pyz
          path: bin/agy_patcher

  release:
    name: Publish GitHub Release
    needs: [build, build-zipapp]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Display downloaded artifacts
        run: ls -R release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p dist-release
          cp release-artifacts/agy_patcher-windows-x64.exe/agy_patcher-windows-x64.exe dist-release/ || true
          cp release-artifacts/agy_patcher-linux-x64/agy_patcher-linux-x64 dist-release/ || true
          cp release-artifacts/agy_patcher-macos-universal/agy_patcher-macos-universal dist-release/ || true
          cp release-artifacts/agy_patcher.pyz/agy_patcher dist-release/agy_patcher.pyz || true
          chmod +x dist-release/* || true
          ls -lh dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist-release/*
          generate_release_notes: true
